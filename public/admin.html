<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Planet Juice Dashboard</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--purple:#7B5EA7;--purple-d:#684C93;--lav-soft:#EFE9F8;--ink:#0B0B0E;--mist:#F3F1F6;--line:#E6E2EC;--muted:#5D5968;--white:#fff;--ok:#1E7B4A;--warn:#9A5B00;--bad:#B3261E;
  --display:"Archivo","Arial Black",Arial,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--mist);color:var(--ink);font:400 15px/1.5 var(--body)}
header{background:var(--ink);color:var(--white)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
header img{height:28px}
header b{font:900 16px/1 var(--display);font-stretch:118%;letter-spacing:.02em}
header button{margin-left:auto}
button,input,select{font:inherit}
.btn{min-height:40px;padding:0 16px;border-radius:9px;border:1.5px solid transparent;background:var(--purple);color:var(--white);font-weight:600;cursor:pointer}
.btn:hover{background:var(--purple-d)}
.btn-line{background:transparent;border-color:#4a4653;color:var(--white)}
.btn-line:hover{background:var(--white);color:var(--ink)}
.login{max-width:380px;margin:12vh auto;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:28px}
.login h1{font:900 26px/1.1 var(--display);font-stretch:112%;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 18px}
.login input{width:100%;height:46px;border:1.5px solid #CDBDE6;border-radius:9px;padding:0 12px;margin-bottom:12px}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:8px 0 0}
.tabs{display:flex;gap:8px;margin:24px 0 16px;flex-wrap:wrap}
.tab{min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--purple);border-color:var(--purple);color:var(--white)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.tools .spacer{flex:1}
.tools a{color:var(--purple-d);font-weight:600}
.list{display:grid;gap:10px;padding-bottom:40px}
.item{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.item h3{margin:0;font-size:16px}
.item .meta{color:var(--muted);font-size:13px}
.item .meta a{color:var(--purple-d);font-weight:600}
.item ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.item .total{font-weight:700}
.item select{height:36px;border-radius:8px;border:1.5px solid var(--line);padding:0 8px;background:var(--white)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--lav-soft);color:var(--purple-d);margin-left:6px;vertical-align:2px}
.s-new{background:#FDECC8;color:var(--warn)}
.s-ready,.s-booked,.s-picked{background:#D9F2E3;color:var(--ok)}
.s-cancelled{background:#F9DEDC;color:var(--bad)}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--muted)}
@media (max-width:600px){.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><img src="/assets/logo.png" alt=""><b>PLANET JUICE · STAFF</b><button class="btn btn-line" id="logout" hidden>Log out</button></div></header>

<form class="login" id="login">
  <h1>Staff dashboard</h1>
  <p>Pickup orders, free-call requests and meal-plan signups.</p>
  <label for="pw" class="meta">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button class="btn" style="width:100%">Log in</button>
  <p class="err" id="login-err" hidden></p>
</form>

<main class="wrap" id="app" hidden>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-type="orders" aria-selected="true">Pickup orders</button>
    <button class="tab" role="tab" data-type="leads" aria-selected="false">Free-call requests</button>
    <button class="tab" role="tab" data-type="subscribers" aria-selected="false">Meal-plan signups</button>
  </div>
  <div class="tools"><span id="count"></span><span class="spacer"></span><a href="#" id="csv" hidden>Download CSV</a><span id="updated"></span></div>
  <div class="list" id="list"></div>
</main>

<script>
(function(){
  var KEY = "pj-admin";
  var pw = ""; try{ pw = sessionStorage.getItem(KEY) || "" }catch(e){}
  var type = "orders", timer;
  var $ = function(s){return document.querySelector(s)};
  var esc = function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var when = function(iso){ try{ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Detroit",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) }catch(e){ return iso } };

  function api(path,opts){
    opts = opts || {}; opts.headers = Object.assign({Authorization:"Bearer "+pw}, opts.headers||{});
    return fetch(path,opts).then(function(r){
      if(r.status===401){ logout("Wrong password."); throw new Error("auth"); }
      return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||"Error"); return j; });
    });
  }
  function logout(msg){
    pw=""; try{ sessionStorage.removeItem(KEY) }catch(e){}
    clearInterval(timer); $("#app").hidden=true; $("#logout").hidden=true; $("#login").hidden=false;
    var e=$("#login-err"); e.textContent=msg||""; e.hidden=!msg;
  }
  function start(){
    $("#login").hidden=true; $("#app").hidden=false; $("#logout").hidden=false;
    load(); clearInterval(timer); timer=setInterval(function(){ if(type==="orders") load() },30000);
  }
  function statusSelect(it,statuses){
    return '<select data-key="'+esc(it.key)+'" aria-label="Status">'+statuses.map(function(s){return '<option'+(s===it.status?' selected':'')+'>'+s+'</option>'}).join("")+'</select>';
  }
  var cls = function(s){return "badge s-"+String(s||"").split(" ")[0]};
  function render(data){
    var items = data.items, st = data.statuses;
    if(type==="subscribers") items.sort(function(a,b){return (b.createdAt||"").localeCompare(a.createdAt||"")});
    var noun = type==="orders"?"order":type==="leads"?"request":"signup";
    $("#count").textContent = items.length+" "+noun+(items.length===1?"":"s");
    $("#csv").hidden = type!=="subscribers";
    $("#updated").textContent = "Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    if(!items.length){ $("#list").innerHTML='<div class="empty">Nothing here yet.</div>'; return; }
    $("#list").innerHTML = items.map(function(it){
      if(type==="orders") return '<article class="item"><div><h3>#'+it.orderNumber+' · '+esc(it.name)+'<span class="'+cls(it.status)+'">'+esc(it.status)+'</span></h3><div class="meta">Pickup '+esc(it.pickupLabel)+' · <a href="tel:'+esc(it.phone)+'">'+esc(it.phone)+'</a> · placed '+when(it.createdAt)+'</div><ul>'+
        (it.items||[]).map(function(l){return '<li>'+l.qty+'× '+esc(l.name)+' ('+esc(l.size)+')</li>'}).join("")+'</ul>'+(it.notes?'<div class="meta" style="margin-top:6px"><b>Notes:</b> '+esc(it.notes)+'</div>':'')+
        '</div><div><div class="total">$'+Number(it.total).toFixed(2)+'</div>'+statusSelect(it,st)+'</div></article>';
      if(type==="leads") return '<article class="item"><div><h3>'+esc(it.name)+'<span class="'+cls(it.status)+'">'+esc(it.status)+'</span></h3><div class="meta">'+esc(it.contact)+' · '+esc(it.goal)+(it.plan?' · '+esc(it.plan)+' plan':'')+' · '+when(it.createdAt)+'</div></div><div>'+statusSelect(it,st)+'</div></article>';
      return '<article class="item"><div><h3>'+esc(it.firstName)+'</h3><div class="meta">'+esc(it.email)+' · '+when(it.createdAt)+'</div></div></article>';
    }).join("");
  }
  function load(){ return api("/api/admin?type="+type).then(render).catch(function(e){ if(e.message!=="auth") $("#list").innerHTML='<div class="empty">'+esc(e.message)+'</div>' }) }

  $("#login").addEventListener("submit",function(e){
    e.preventDefault(); pw=$("#pw").value;
    api("/api/admin?type=orders").then(function(d){ try{ sessionStorage.setItem(KEY,pw) }catch(e){} start(); render(d); }).catch(function(){});
  });
  $("#logout").addEventListener("click",function(){ logout() });
  document.querySelector(".tabs").addEventListener("click",function(e){
    var b=e.target.closest(".tab"); if(!b) return; type=b.dataset.type;
    document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",String(t===b))});
    $("#list").innerHTML=""; load();
  });
  $("#list").addEventListener("change",function(e){
    var s=e.target.closest("select[data-key]"); if(!s) return;
    api("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:type,key:s.dataset.key,status:s.value})}).then(load).catch(function(err){ alert(err.message) });
  });
  $("#csv").addEventListener("click",function(e){
    e.preventDefault();
    fetch("/api/admin?type=subscribers&format=csv",{headers:{Authorization:"Bearer "+pw}}).then(function(r){return r.blob()}).then(function(b){
      var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="meal-plan-subscribers.csv"; a.click();
    });
  });
  if(pw) start();
})();
</script>
</body>
</html>

# Publishes the repo root as the site (static files, no build step).
# If your Netlify project was set to publish "public", this file overrides it.
[build]
  publish = "."
  # Regenerates pages from data/*.json and fails the deploy (old site stays live) if anything is out of sync.
  command = "node scripts/build.mjs && node scripts/check.mjs"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/free-meal-plan.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Keep the repo's working files out of the public site.
[[redirects]]
  from = "/AUDIT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/OWNER-TODO.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true
